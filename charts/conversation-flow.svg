<text x="32.0" y="504.0" font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif' font-size="11" fill="#898781" font-weight="400" text-anchor="start">Flagged turns come from two mechanical rules over the transcript: a turn that ends mid-sentence with no terminal punctuation, and a turn whose text is re-sent as the</text>
<text x="32.0" y="520.0" font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif' font-size="11" fill="#898781" font-weight="400" text-anchor="start">opening of the speaker&#x27;s next turn. Both are conversation-quality signals the LLM judge described in prose; these rules make them countable across calls.</text>
<text x="32.0" y="546.0" font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif' font-size="11" fill="#898781" font-weight="400" text-anchor="start">Generated by charts/generate_charts.py from the judge&#x27;s CSV output.</text>
